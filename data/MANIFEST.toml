# Data manifest: origin, author and licence of every file.
# Checked by scripts/check-licenses.sh, which runs in CI.
#
# path accepts a glob (fnmatch); exact entries win over globs.
# modified = true when the file differs from the 1995/2011 original.
# ai: fill in for any AI-generated asset (tool, model, date).

[meta]
ignore = [
    "CMakeLists.txt",   # build
    ".gitignore",       # build
    "READMD.md",        # a note inherited from upstream, no role in the game
    "MANIFEST.toml",    # this file
    "classic.sha256",   # checksums of the original data, not an asset
]
allowed_licenses = [
    "public-domain",
    "CC0",
    "CC-BY-4.0",
    "CC-BY-SA-4.0",
    "GPL-2.0",
    # What the binary actually is: COPYING puts src/sdlport/* under GPL 2+,
    # and everything around it is public domain or WTFPL, which does not
    # narrow that. Assets we write ourselves follow the binary.
    "GPL-2.0-or-later",
    "OFL-1.1",
]

