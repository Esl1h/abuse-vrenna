name: Nightly

on:
  schedule:
    # 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Dependencies
        run: |
          sudo apt-get update
          # Same list as ci.yml, and for the same reason: see the comment
          # there. CPM builds SDL3 from source and a missing dependency for an
          # enabled subsystem fails the configure step outright.
          sudo apt-get install -y --no-install-recommends \
            ninja-build imagemagick \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev \
            libfribidi-dev libthai-dev libusb-1.0-0-dev \
            libwayland-dev wayland-protocols libdecor-0-dev

      - name: CPM cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-linux-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-linux-

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      # The asan preset turns off UBSan's alignment and null-pointer checks:
      # the 1995 loaders read structs straight out of file data.
      - name: Replays under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          # The played replay takes about 30s under ASan on a desktop and
          # four times that on a runner, which the default 120s bound cuts
          # off on most nights.
          ABUSE_RUN_TIMEOUT: 600
        run: ./scripts/test-replays.sh ./build/asan/src/abuse

      - name: Unit tests under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./build/asan/tests/abuse_unit_tests
